<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Get a Quote | Heptra Services LLC</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <nav>
    <a href="home.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="quote.html">Get a Quote</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <h1>Request a Free Quote</h1>
    <form action="mailto:heptraservices@gmail.com" method="POST" enctype="text/plain">
      <label>Full Name:</label><br/>
      <input type="text" name="name" required><br/>

      <label>Email:</label><br/>
      <input type="email" name="email" required><br/>

      <label>Phone Number:</label><br/>
      <input type="tel" name="phone"><br/>

      <label>Type of Cleaning:</label><br/>
      <select name="service">
        <option>Office</option>
        <option>Residential</option>
        <option>Post Construction</option>
        <option>Move In/Out</option>
        <option>Floor/Carpet</option>
      </select><br/>

      <label>Preferred Date:</label><br/>
      <input type="date" name="date"><br/>

      <label>Additional Notes:</label><br/>
      <textarea name="notes"></textarea><br/><br/>

      <button type="submit">Submit Quote Request</button>
    </form>
  </main>

  <footer>
    &copy; 2025 Heptra Services LLC
  </footer>
</body>
</html>
